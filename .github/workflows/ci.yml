name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Job 1: Build aur test (sabse pehle)
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Code download karo
        uses: actions/checkout@v4

      - name: .NET 8 setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build aur test
        run: dotnet test tests/WebApp.Tests/WebApp.Tests.csproj -c Release

  # Job 2: Security (build-test pass hone ke baad)
  security:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Code download karo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: .NET 8 setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Vulnerable packages check
