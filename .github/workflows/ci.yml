name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Code download karo
        uses: actions/checkout@v4

      - name: .NET 8 setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build aur test
        run: dotnet test tests/WebApp.Tests/WebApp.Tests.csproj -c Release

  security:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Code download karo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: .NET 8 setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Packages restore
        run: dotnet restore tests/WebApp.Tests/WebApp.Tests.csproj

      - name: Vulnerable packages list
        run: dotnet list tests/WebApp.Tests/WebApp.Tests.csproj package --vulnerable --include-transitive | tee vuln.txt

      - name: Vulnerable package mila to fail karo
        run: "if grep -q 'has the following vulnerable packages' vuln.txt; then exit 1; fi"

      - name: CodeQL shuru karo
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build for CodeQL
        run: dotnet build tests/WebApp.Tests/WebApp.Tests.csproj -c Release

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v3

  docker:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Code download karo
        uses: actions/checkout@v4

      - name: Docker image banao
        run: docker build -t webapp:ci .

      - name: Image security scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: webapp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Container chalao
        run: docker run -d -p 8080:8080 --name webapp webapp:ci

      - name: Health check
        run: curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8080/health
