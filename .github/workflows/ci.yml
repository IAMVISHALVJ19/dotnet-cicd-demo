name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Code download karo
        uses: actions/checkout@v4

      - name: .NET 8 setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build aur test
        run: dotnet test tests/WebApp.Tests/WebApp.Tests.csproj -c Release
